name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Установка зависимостей и тесты бэкенда (с учетом папки lab8)
      - name: Install server dependencies
        working-directory: ./lab8/server
        run: npm ci

      - name: Run server tests
        working-directory: ./lab8/server
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      # 2. Установка зависимостей и сборка фронтенда (с учетом папки lab8)
      - name: Install client dependencies
        working-directory: ./lab8/client
        run: npm ci

      - name: Build client
        working-directory: ./lab8/client
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4

      # Запуск деплоя бэкенда на Render через деплой-хук
      - name: Запустить деплой на Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&ref=${{ github.sha }}"
